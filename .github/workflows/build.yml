name: Build

# Tiap kali kode diunggah, GitHub menjalankan tes lalu membuat OxideCut.exe untuk Windows.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Tes dan build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Jalankan tes
        run: cargo test --workspace

      - name: Build versi rilis
        run: cargo build --release -p oxidecut-app

      # FFmpeg disertakan sebagai program terpisah di folder "ffmpeg" (tidak digabung ke OxideCut.exe).
      # Wajib varian LGPL ("lgpl-shared"). JANGAN ganti ke varian "gpl".
      # Kalau unduhan ini gagal karena versinya sudah tidak disediakan, lihat daftar terbaru di
      # https://github.com/BtbN/FFmpeg-Builds/releases/tag/latest lalu sesuaikan FFMPEG_ZIP.
      - name: Unduh FFmpeg (LGPL)
        shell: pwsh
        env:
          FFMPEG_ZIP: ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_ZIP"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unzipped
          $root = (Get-ChildItem ffmpeg-unzipped -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force dist/ffmpeg | Out-Null
          Copy-Item "$root/bin/ffmpeg.exe" dist/ffmpeg/
          Copy-Item "$root/bin/ffprobe.exe" dist/ffmpeg/
          Copy-Item "$root/bin/*.dll" dist/ffmpeg/
          Copy-Item "$root/LICENSE.txt" dist/ffmpeg/LICENSE.txt
          Set-Content dist/ffmpeg/SUMBER.txt "FFmpeg (LGPL), tidak diubah. Build: https://github.com/BtbN/FFmpeg-Builds  ($env:FFMPEG_ZIP). Kode sumber: https://ffmpeg.org"

      - name: Pastikan FFmpeg yang disertakan bukan versi GPL dan bisa jalan
        shell: pwsh
        run: |
          $config = & dist/ffmpeg/ffmpeg.exe -hide_banner -buildconf | Out-String
          if ($config -match "--enable-gpl" -or $config -match "--enable-nonfree") {
            throw "FFmpeg ini bukan build LGPL."
          }
          & dist/ffmpeg/ffprobe.exe -version | Select-Object -First 1

      - name: Kumpulkan berkas
        shell: pwsh
        run: |
          Copy-Item target/release/oxidecut.exe dist/OxideCut.exe
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item assets/fonts/FluentSystemIcons-LICENSE.txt dist/FluentSystemIcons-LICENSE.txt

      - name: Simpan hasil build
        uses: actions/upload-artifact@v4
        with:
          name: OxideCut-windows-x64
          path: dist/

  # Hanya di cabang main: perbarui rilis percobaan "dev" supaya ada satu tautan unduh tetap.
  release:
    name: Rilis percobaan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OxideCut-windows-x64
          path: OxideCut

      - name: Buat ZIP
        run: zip -r OxideCut-windows-x64.zip OxideCut

      - name: Perbarui rilis dev
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev OxideCut-windows-x64.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "OxideCut versi percobaan" \
            --notes "Build otomatis dari cabang main. Belum stabil. Belum ditandatangani, jadi Windows mungkin menampilkan peringatan saat pertama dibuka."
